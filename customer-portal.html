 
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetBill Customer Portal</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }
        header {
            background: #12345a;
            color: white;
            padding: 22px;
            text-align: center;
        }
        main {
            max-width: 450px;
            margin: 40px auto;
            padding: 25px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 18px #00000012;
        }
        h2 { text-align: center; }
        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 13px;
            margin-top: 7px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
        }
        button {
            width: 100%;
            padding: 13px;
            margin-top: 15px;
            border: 0;
            border-radius: 7px;
            background: #0878d1;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
        #logoutButton { background: #dc2626; }
        #message {
            text-align: center;
            margin-top: 15px;
            overflow-wrap: anywhere;
        }
        #account {
            display: none;
            text-align: center;
        }
    </style>
</head>
<body>
    <header>
        <h1>NETBILL</h1>
        <p>Customer Self-Service Portal</p>
    </header>

    <main>
        <section id="loginSection">
            <h2>Customer Login</h2>

            <form id="loginForm">
                <label>Email Address</label>
                <input type="email" id="email" required>

                <label>Password</label>
                <input type="password" id="password" required>

                <button type="submit">Login</button>
            </form>
        </section>

        <section id="account">
            <h2>Welcome to NetBill!</h2>
            <p id="customerEmail"></p>
            <p>Your account login is successful.</p>
            <button id="logoutButton">Logout</button>
        </section>

        <p id="message"></p>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>

    <script>
        const db = window.netbillSupabase;

        const loginForm = document.getElementById("loginForm");
        const loginSection = document.getElementById("loginSection");
        const account = document.getElementById("account");
        const message = document.getElementById("message");

        function showAccount(user) {
            loginSection.style.display = "none";
            account.style.display = "block";
            document.getElementById("customerEmail").textContent =
                user.email || "";
            message.textContent = "";
        }

        async function checkSession() {
            if (!db) {
                message.textContent =
                    "Supabase connection not found. Check supabase-config.js.";
                return;
            }

            const { data, error } = await db.auth.getSession();

            if (error) {
                message.textContent = error.message;
                return;
            }

            if (data.session) {
                showAccount(data.session.user);
            }
        }

        loginForm.addEventListener("submit", async function(event) {
            event.preventDefault();

            if (!db) {
                message.textContent =
                    "Supabase connection not found. Check supabase-config.js.";
                return;
            }

            message.textContent = "Logging in...";

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            const { data, error } = await db.auth.signInWithPassword({
                email: email,
                password: password
            });

            if (error) {
                message.textContent = "Login failed: " + error.message;
                return;
            }

            showAccount(data.user);
        });

        document.getElementById("logoutButton")
            .addEventListener("click", async function() {
                const { error } = await db.auth.signOut();

                if (error) {
                    message.textContent = error.message;
                    return;
                }

                account.style.display = "none";
                loginSection.style.display = "block";
                loginForm.reset();
                message.textContent = "You have logged out successfully.";
            });

        checkSession();
    </script>
</body>
</html>
