 
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NetBill Administrator Login</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    background: #eef2f7;
    font-family: Arial, sans-serif;
}

.container {
    width: 100%;
    max-width: 430px;
    background: white;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 5px 25px rgba(0,0,0,0.1);
}

h1 { text-align: center; color: #123b68; }

.subtitle {
    text-align: center;
    color: #666;
    margin-bottom: 25px;
}

label {
    display: block;
    margin-top: 14px;
    margin-bottom: 6px;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 15px;
}

button {
    width: 100%;
    margin-top: 15px;
    padding: 13px;
    border: none;
    border-radius: 6px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

.submit-btn {
    background: #123b68;
    color: white;
}

.passkey-btn {
    background: #168447;
    color: white;
}

.register-btn {
    background: #0878d1;
    color: white;
}

.continue-btn {
    background: #123b68;
    color: white;
}

#message {
    display: none;
    margin-top: 18px;
    padding: 12px;
    border-radius: 6px;
    line-height: 1.5;
    overflow-wrap: anywhere;
    white-space: pre-line;
}

#message.success {
    display: block;
    background: #e4f7e9;
    color: #17652b;
}

#message.error {
    display: block;
    background: #ffe8e8;
    color: #a32121;
}

#passkeySetup {
    display: none;
    margin-top: 20px;
    padding-top: 15px;
    border-top: 1px solid #ddd;
}

#passkeySetup p {
    color: #555;
    line-height: 1.5;
    text-align: center;
}
</style>
</head>

<body>

<div class="container">

    <h1>NETBILL</h1>
    <p class="subtitle">ISP Billing & Management System</p>

    <section id="loginSection">

        <h3>Administrator Login</h3>

        <form id="loginForm">

            <label>Email Address</label>
            <input
                type="email"
                id="loginEmail"
                placeholder="Enter your owner email"
                required
            >

            <label>Password</label>
            <input
                type="password"
                id="loginPassword"
                placeholder="Enter your owner password"
                required
            >

            <button type="submit" class="submit-btn" id="loginButton">
                LOGIN WITH PASSWORD
            </button>

        </form>

        <button type="button" class="passkey-btn" id="passkeyLoginButton">
            LOGIN WITH FINGERPRINT / PASSKEY
        </button>

    </section>

    <section id="passkeySetup">

        <h3>Secure Your NetBill Login</h3>

        <p>
            Register a passkey on this device to use fingerprint,
            face recognition or your device PIN for future logins.
        </p>

        <button type="button" class="register-btn" id="registerPasskeyButton">
            REGISTER THIS DEVICE
        </button>

        <button type="button" class="continue-btn" id="continueButton">
            CONTINUE TO DASHBOARD
        </button>

    </section>

    <div id="message"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-config.js"></script>

<script>

const db = window.netbillSupabase;

const loginForm = document.getElementById("loginForm");
const loginButton = document.getElementById("loginButton");
const passkeyLoginButton = document.getElementById("passkeyLoginButton");
const registerPasskeyButton = document.getElementById("registerPasskeyButton");
const continueButton = document.getElementById("continueButton");
const loginSection = document.getElementById("loginSection");
const passkeySetup = document.getElementById("passkeySetup");
const message = document.getElementById("message");

let authenticatedUser = null;

function showMessage(text, type) {
    message.textContent = text;
    message.className = type;
}

function checkPasskeySupport() {
    if (!window.isSecureContext || !navigator.credentials) {
        throw new Error(
            "Passkeys require a supported browser and a secure HTTPS connection."
        );
    }

    if (!db.auth.registerPasskey || !db.auth.signInWithPasskey) {
        throw new Error(
            "Passkey support is unavailable in the loaded Supabase library."
        );
    }
}

async function verifyAdministrator(user) {

    if (!user) {
        throw new Error("No authenticated user was returned.");
    }

    const { data: company, error } = await db
        .from("netbill_companies")
        .select("id, company_name")
        .eq("owner_id", user.id)
        .maybeSingle();

    if (error) throw error;

    if (!company) {
        await db.auth.signOut();

        throw new Error(
            "Your company record could not be found. Please check your company ownership."
        );
    }

    localStorage.setItem("netbillCompanyId", company.id);
    localStorage.setItem("netbillOwnerId", user.id);
    localStorage.setItem("netbillOwnerEmail", user.email);
    localStorage.setItem("netbillCloudCompanyName", company.company_name);

    sessionStorage.setItem("netbillAdminLoggedIn", "true");

    authenticatedUser = user;

    return company;
}

function showLoginSuccess(user, company, allowRegistration) {

    loginSection.style.display = "none";
    passkeySetup.style.display = "block";

    if (!allowRegistration) {
        registerPasskeyButton.style.display = "none";
    }

    showMessage(
        "Login successful!\n" +
        "Administrator: " + user.email +
        "\nCompany: " + company.company_name,
        "success"
    );
}

// NORMAL PASSWORD LOGIN
loginForm.addEventListener("submit", async function(event) {

    event.preventDefault();

    loginButton.disabled = true;
    loginButton.textContent = "CONNECTING...";

    try {

        const email = document.getElementById("loginEmail")
            .value.trim().toLowerCase();

        const password = document.getElementById("loginPassword").value;

        if (!db) {
            throw new Error("Supabase connection was not found.");
        }

        showMessage("Checking your login details...", "success");

        const { data, error } = await db.auth.signInWithPassword({
            email: email,
            password: password
        });

        if (error) throw error;

        const company = await verifyAdministrator(data.user);

        showLoginSuccess(data.user, company, true);

    } catch (error) {

        showMessage("LOGIN FAILED:\n" + error.message, "error");

    } finally {

        loginButton.disabled = false;
        loginButton.textContent = "LOGIN WITH PASSWORD";

    }

});

// PASSKEY LOGIN
passkeyLoginButton.addEventListener("click", async function() {

    passkeyLoginButton.disabled = true;
    passkeyLoginButton.textContent = "VERIFYING PASSKEY...";

    try {

        checkPasskeySupport();

        showMessage("Waiting for your device authentication...", "success");

        const { data, error } = await db.auth.signInWithPasskey();

        if (error) throw error;

        const company = await verifyAdministrator(data.user);

        showLoginSuccess(data.user, company, false);

        showMessage(
            "Passkey login successful!\nWelcome back, " + data.user.email,
            "success"
        );

    } catch (error) {

        showMessage("PASSKEY LOGIN FAILED:\n" + error.message, "error");

    } finally {

        passkeyLoginButton.disabled = false;
        passkeyLoginButton.textContent = "LOGIN WITH FINGERPRINT / PASSKEY";

    }

});

// REGISTER THIS DEVICE
registerPasskeyButton.addEventListener("click", async function() {

    registerPasskeyButton.disabled = true;
    registerPasskeyButton.textContent = "REGISTERING...";

    try {

        if (!authenticatedUser) {
            throw new Error("Please log in with your password first.");
        }

        checkPasskeySupport();

        const { data, error } = await db.auth.registerPasskey();

        if (error) throw error;

        showMessage(
            "SUCCESS! Your passkey has been registered.\n" +
            "You can now use this device to log in to NetBill.",
            "success"
        );

        registerPasskeyButton.textContent = "PASSKEY REGISTERED";

    } catch (error) {

        showMessage("REGISTRATION FAILED:\n" + error.message, "error");

        registerPasskeyButton.disabled = false;
        registerPasskeyButton.textContent = "REGISTER THIS DEVICE";

    }

});

// OPEN DASHBOARD
continueButton.addEventListener("click", function() {

    if (!authenticatedUser) {
        showMessage("Please log in first.", "error");
        return;
    }

    window.location.href = "index.html";

});

</script>

</body>
</html>
